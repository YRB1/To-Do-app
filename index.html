<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YRB’s World · Command Centre</title>
<meta name="description" content="Tasks, goals, businesses, trading journal and wealth tracking — one command centre.">
<meta name="theme-color" content="#070816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YRB’s World">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Apply theme before first paint (no flash)
  try {
    var h = document.documentElement, t = localStorage.getItem('empire_theme');
    if (!t) t = 'dark';
    h.dataset.theme = t; h.dataset.accent = localStorage.getItem('empire_accent') || 'violet';
    if (localStorage.getItem('empire_black')) h.dataset.black = '1';
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8dc83"/><stop offset="1" stop-color="#d99a1e"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#059669"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
</defs></svg>

<div class="app">
  <aside class="sidebar glass" id="sidebar" aria-label="Main navigation"></aside>
  <main class="main">
    <header class="topbar glass">
      <div class="page-title"><h1 id="pageTitle">YRB’s World</h1><p id="pageSub"></p></div>
      <div class="topbar-actions">
        <div id="viewActions" class="row"></div>
        <div class="clock" id="clock" aria-live="off"></div>
        <button class="btn icon" id="themeBtn" onclick="Theme.toggle()" aria-label="Toggle light and dark mode"></button>
        <button class="btn gold icon" onclick="QuickAdd.open()" aria-label="Quick add" title="Quick add (Ctrl/⌘+K)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<nav class="tabbar glass" id="tabbar" aria-label="Tabs"></nav>
<div id="musicDock" class="music-dock" aria-label="Music player"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript><p style="padding:40px;text-align:center">YRB’s World needs JavaScript enabled.</p></noscript>

<script src="js/core.js"></script>
<script src="js/integrations.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/views/goals.js"></script>
<script src="js/views/business.js"></script>
<script src="js/views/trading.js"></script>
<script src="js/views/wealth.js"></script>
<script src="js/views/habits.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/profile.js"></script>
<script src="js/views/music.js"></script>
<script src="js/views/coach.js"></script>
<script src="js/app.js"></script>
</body>
</html>
